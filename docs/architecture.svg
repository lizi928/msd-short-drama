<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160"
     font-family="'Segoe UI','Microsoft YaHei',Arial,sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">码上短剧当前项目架构</title>
  <desc id="desc">Vue 3 前端经网关访问用户、短剧、订单、互动、Agent 和内容 RAG 服务；订单与互动通过 Feign 调用短剧；互动通过 Kafka 更新短剧计数；短剧服务使用 Caffeine + Redis 多级缓存、布隆过滤器、击穿锁和 Java 21 虚拟线程，并由 xxl-job 每 5 分钟重建布隆；Agent 使用 Redis 会话、DeepSeek 模型，并通过 Nacos 发现调用 audit A2A 服务；AgentScope Supervisor 通过 companion-agent 调用 content-service 的当前集摘要与前情工具；msd-content-service 使用 DeepSeek 改写查询，Milvus 向量与 Elasticsearch BM25 混合检索，DashScope Rerank 精排后生成推荐理由，并提供分集摘要和结构化审核。数据层包含 MySQL、Redis、Kafka、Nacos、MinIO、Milvus、Elasticsearch、etcd、Seata。</desc>

